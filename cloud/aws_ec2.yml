plugin: amazon.aws.aws_ec2
regions:
  - us-east-2
filters:
  tag:course: ansible-from-zero
  instance-state-name: running
use_deprecated_tags: false
hostnames:
  - tag:Name
keyed_groups:
  - key: ec2_tags.os
    prefix: os
  - key: instance_type
    prefix: type
compose:
  ansible_host: public_ip_address
cache: true
cache_plugin: ansible.builtin.jsonfile
cache_connection: ~/.cache/ansible_aws_ec2
cache_timeout: 300
