---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    update_cache: true
    cache_valid_time: 3600
- name: Configure the load balancer
  ansible.builtin.template:
    src: lb.conf.j2
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: Reload nginx
- name: Keep nginx running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
