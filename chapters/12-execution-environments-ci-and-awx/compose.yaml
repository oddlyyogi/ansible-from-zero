---
x-node: &node
  build: lab
  privileged: true
  cgroup: host
  volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
services:
  lb1:
    <<: *node
    hostname: lb1
    ports: ["127.0.0.1:2221:22", "127.0.0.1:8480:80"]
  web1:
    <<: *node
    hostname: web1
    ports: ["127.0.0.1:2222:22"]
  web2:
    <<: *node
    hostname: web2
    ports: ["127.0.0.1:2223:22"]
  db1:
    <<: *node
    hostname: db1
    ports: ["127.0.0.1:2224:22"]
