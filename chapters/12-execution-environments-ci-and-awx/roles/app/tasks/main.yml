---
- name: Install the database driver
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present
- name: Create the app folder
  ansible.builtin.file:
    path: /opt/site
    state: directory
    mode: "0755"
- name: Deploy the app
  ansible.builtin.template:
    src: app.py.j2
    dest: /opt/site/app.py
    mode: "0644"
  notify: Restart the app
- name: Install the service unit
  ansible.builtin.template:
    src: site-app.service.j2
    dest: /etc/systemd/system/site-app.service
    mode: "0644"
  notify: Restart the app
- name: Keep the app running
  ansible.builtin.systemd:
    name: site-app
    state: started
    enabled: true
    daemon_reload: true
