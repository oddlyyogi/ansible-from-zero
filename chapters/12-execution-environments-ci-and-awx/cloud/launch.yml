---
- name: Launch two cloud servers
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aws_region: us-east-2
    course_tag: ansible-from-zero
  tasks:
    - name: Find our public address
      ansible.builtin.uri:
        url: https://checkip.amazonaws.com
        return_content: true
      register: my_ip
    - name: Upload our public key
      amazon.aws.ec2_key:
        name: ansible-from-zero
        key_material: "{{ lookup('ansible.builtin.file', '~/.ssh/ansible_lab.pub') }}"
        region: "{{ aws_region }}"
    - name: Allow SSH and HTTP from our address only
      amazon.aws.ec2_security_group:
        name: ansible-from-zero
        description: SSH and HTTP from the control node
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: [22, 80]
            cidr_ip: "{{ my_ip.content | trim }}/32"
      register: sg
    - name: Find the newest Debian 13 image
      amazon.aws.ec2_ami_info:
        owners: ["136693071363"]
        filters:
          name: debian-13-amd64-*
          architecture: x86_64
        region: "{{ aws_region }}"
      register: debian
    - name: Find the newest Windows Server 2025 image
      amazon.aws.ec2_ami_info:
        owners: [amazon]
        filters:
          name: Windows_Server-2025-English-Full-Base-*
        region: "{{ aws_region }}"
      register: windows
    - name: Launch the Linux server
      amazon.aws.ec2_instance:
        name: afz-linux
        image_id: "{{ (debian.images | sort(attribute='creation_date') | last).image_id }}"
        instance_type: t3.micro
        key_name: ansible-from-zero
        security_group: "{{ sg.group_id }}"
        network_interfaces:
          - assign_public_ip: true
        tags:
          course: "{{ course_tag }}"
          os: linux
        region: "{{ aws_region }}"
        state: running
        wait: true
    - name: Launch the Windows server
      amazon.aws.ec2_instance:
        name: afz-windows
        image_id: "{{ (windows.images | sort(attribute='creation_date') | last).image_id }}"
        instance_type: t3.small
        user_data: "{{ lookup('ansible.builtin.template', 'windows_ssh.ps1.j2') }}"
        security_group: "{{ sg.group_id }}"
        network_interfaces:
          - assign_public_ip: true
        tags:
          course: "{{ course_tag }}"
          os: windows
        region: "{{ aws_region }}"
        state: running
        wait: true
