---
- name: Set up the web servers
  hosts: webservers
  become: true
  roles:
    - nginx
    - role: site
      site_release: "1.2"
    - geerlingguy.git
  tasks:
    - name: Helper tools, when wanted
      ansible.builtin.include_role:
        name: tools
      when: install_tools | default(true) | bool