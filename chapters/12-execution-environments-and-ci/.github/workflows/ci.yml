name: CI
on:
  push:
  pull_request:
jobs:
  lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: pip install -r requirements.txt
      - name: SSH key for the lab
        run: |
          mkdir -p ~/.ssh && ssh-keygen -q -t ed25519 -f ~/.ssh/ansible_lab -N '' -C ci
          cp ~/.ssh/ansible_lab.pub lab/authorized_keys
      - name: Start the four lab servers
        run: |
          docker compose up -d --build
          for p in 2221 2222 2223 2224; do
            until ssh-keyscan -p $p 127.0.0.1 2>/dev/null | grep -q ed25519; do
              sleep 1
            done
          done
      - name: Roles and collections from Galaxy
        run: ansible-galaxy install -r requirements.yml
      - name: The lab's Vault password
        run: printf 'battery-staple-two\n' > .vault_pass && chmod 600 .vault_pass
      - name: Ping every server
        run: ansible all -m ping
      - name: Deploy twice; the second run must change nothing
        run: |
          ansible-playbook site.yml
          ansible-playbook site.yml | tee second.txt
          grep -q 'changed=0' second.txt
      - name: Lint
        run: ansible-lint
      - name: Molecule
        run: molecule test
