name: CI
on:
  push:
  pull_request:
jobs:
  lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: pip install -r requirements.txt
      - name: SSH key for the lab
        run: |
          mkdir -p ~/.ssh && ssh-keygen -q -t ed25519 -f ~/.ssh/ansible_lab -N '' -C ci
          cp ~/.ssh/ansible_lab.pub lab/authorized_keys
      - name: Start the four lab servers
        run: |
          docker compose up -d --build
          for p in 2221 2222 2223 2224; do
            for i in $(seq 90); do ssh-keyscan -p $p 127.0.0.1 2>/dev/null | grep -q ssh-ed25519 && break; sleep 1; done
          done
      - name: Roles and collections from Galaxy (if the chapter has them)
        run: if [ -f requirements.yml ]; then ansible-galaxy install -r requirements.yml; fi
      - name: The lab's Vault password, the one shown in the videos (if the chapter uses Vault)
        run: |
          if grep -q vault_password_file ansible.cfg; then
            printf 'battery-staple-two\n' > .vault_pass && chmod 600 .vault_pass
          fi
      - name: Ping every server
        run: ansible all -m ping
      - name: Run the playbook (if the chapter has one)
        run: |
          if [ -f site.yml ]; then ansible-playbook site.yml; ansible-playbook site.yml | tee second.txt; grep -q 'changed=0' second.txt; fi
      - name: Lint (if the chapter configures ansible-lint)
        run: if [ -f .ansible-lint ]; then ansible-lint; fi
      - name: Molecule (if the chapter has a scenario)
        run: if [ -d molecule/default ]; then molecule test; fi
